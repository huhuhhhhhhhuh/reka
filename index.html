<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер наград Речного племени</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="modal-backdrop" id="authModal">
  <div class="modal">
    <h2 class="display" id="authTitle">Вход</h2>
    <div class="field">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="name@example.com">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="authPassword" placeholder="минимум 6 символов">
    </div>
    <button class="btn btn-primary" id="btnAuthSubmit">Войти</button>
    <p class="hint" id="authError" style="color:#c97b6b; display:none; margin-top:14px; margin-bottom:0;"></p>
    <p class="hint" id="authInfo" style="color:#8cb8a9; display:none; margin-top:14px; margin-bottom:0;"></p>
    <div class="auth-divider"></div>
    <button class="btn btn-ghost" id="btnAuthToggleMode">Зарегистрироваться</button>
    <button class="btn btn-ghost" id="btnForgotPassword" style="margin-top:6px;">Забыл пароль?</button>
  </div>
</div>
<header>
  <svg class="river-svg" viewBox="0 0 1000 24" preserveAspectRatio="none">
    <path d="M0,14 C120,4 200,24 340,14 C480,4 560,24 700,14 C840,4 920,24 1000,14 L1000,24 L0,24 Z" fill="none" stroke="var(--river-line)" stroke-width="1.5"/>
  </svg>
  <span class="firefly"></span><span class="firefly"></span><span class="firefly"></span><span class="firefly"></span>
  <div class="header-inner">
    <h1 class="title display">Речное племя</h1>

 <div id="readyBanner" class="ready-banner" style="display:none;">
      <div class="text"> У тебя <strong id="readyCountDisplay">0</strong> <span id="readyTextDisplay">наград, готовых</span> к запросу!</div>
      <button class="btn btn-primary" style="padding: 6px 12px; font-size: 13px; width: auto;" onclick="window.markAllReadyAsRequested()">Отметить все как запрошенные</button>
    </div>
    <div class="overview" style="margin-top: 24px;">
      <div class="river-progress">
        <div class="label"><span>Прогресс медалей</span><span class="count mono" id="medalsCount">0 / 0</span></div>
        <div class="river-track"><div class="river-fill" id="medalsFill"></div></div>
      </div>
      <div class="river-progress">
        <div class="label"><span>Прогресс ачивок</span><span class="count mono" id="achCount">0 / 0</span></div>
        <div class="river-track"><div class="river-fill" id="achFill"></div></div>
      </div>
      <div class="domain-switch" title="Домен для ссылок на блоги">
        <span>Блоги:</span>
        <button class="domain-btn active" id="btnDomainNet">.net</button>
        <button class="domain-btn" id="btnDomainSu">.su</button>
        <button id="btnLogout" class="domain-btn" style="display:none; margin-left: 8px;" title="Выйти из аккаунта">Выйти</button>
      </div>
    </div>
  </div>
</header>
<div class="view-tabs" id="viewTabs"></div>
<main class="medals" id="view-medals"><div id="medalsList"></div></main>
<main class="medals" id="view-achievements"><div id="achievementsList"></div></main>
<main class="medals" id="view-requested"><div id="requestedList"></div></main>
<main class="medals" id="view-received"><div id="receivedList"></div></main>
<div class="view-section" id="view-planner"></div>
<div class="view-section" id="view-stats"></div>
<footer class="page-footer"> <p style="opacity: 0.85; font-size: 9px;"> :3 <br>
              <b>Авторство:</b> Тенька [1707227] [<a href="https://vk.com/mirotvorkaa" target="_blank" style="color: var(--text-bright); text-decoration: underline;">VK</a>]
              <br>
              По всем вопросам и возникающим проблемам можно обращаться к ней.
            </p></footer>
<div class="save-flag" id="saveFlag">✓ сохранено</div>

<script src="app.js"></script>
</body>
</html>
